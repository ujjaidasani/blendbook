# Runs the tests on Mac and Windows on every push. A tag like v1.0.0 also builds the Mac and Windows apps,
# starts each built app as a check, and attaches them to a draft GitHub release to review and publish.
name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  mac:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]  # Apple Silicon and Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: PYTHON=python ./packaging/build_mac.sh
      - name: Start the built app
        run: python packaging/smoke_test.py dist/Blendbook.app/Contents/MacOS/Blendbook
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.os }}
          path: dist/*.dmg

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean packaging/blendbook.spec
      - name: Start the built app
        run: python packaging/smoke_test.py dist/Blendbook/Blendbook.exe
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path server.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging\windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Draft a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*/* --draft --title "Blendbook ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
